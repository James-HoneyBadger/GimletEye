[package]
name = "gimlet-eye-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gimlet-eye-crypto = { path = ".." }

# Detached from the workspace on purpose, like `crates/scrub/fuzz`: these targets
# need nightly and libFuzzer, and the workspace itself has to build on stable.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "container"
path = "fuzz_targets/container.rs"
test = false
doc = false
