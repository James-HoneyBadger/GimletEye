[package]
name = "mellivora-crypto"
description = "Cryptographic tools for Mellivora ToolKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["openpgp"]
# The `crypto.gpg-*` tools shell out to the system gpg. On by default so the
# shipped build and the tests agree; `--no-default-features` removes them.
openpgp = []

[dependencies]
mellivora-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
