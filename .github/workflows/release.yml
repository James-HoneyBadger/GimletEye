name: release

# A tag produces the artifacts: CLI archives for five targets and desktop
# installers for Linux, macOS, and Windows, plus checksums, all attached to one
# release. Nothing is published unless every build succeeds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string
      unsigned:
        description: Publish without a signature (only when the key is unavailable)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `inputs.tag` on a manual run, the pushed tag otherwise.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Reproducibility: absolute paths are the one thing a Rust build embeds that
  # differs between machines and checkouts. Remapping them to `.` makes the same
  # source produce the same bytes, so a release can be rebuilt and compared.
  # Incremental compilation is off for the same reason.
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '--remap-path-prefix=${{ github.workspace }}=.' 

jobs:
  cli:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: tar.gz
            linker: aarch64-linux-gnu-gcc
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            arch: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            arch: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p gimlet-eye-cli --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="gimlet-${RELEASE_TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/gimlet" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "gimlet-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gimlet.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macos-aarch64
            os: macos-14
            bundles: dmg
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install the JavaScript dependencies
        run: |
          npm ci --prefix packages/ui
          npm ci --prefix apps/desktop
          npm run build --prefix packages/ui

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # No tagName: build only. The publish job attaches everything.
          args: --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # A release is only trustworthy if someone else can rebuild it. This builds the
  # same tag twice, from two different directories, and refuses to publish when
  # the bytes differ - which is what a leaked absolute path or a changed
  # dependency resolution looks like.
  reproducible:
    name: reproducible (rebuild and compare)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build here
        run: |
          cargo build --release --locked -p gimlet-eye-cli
          sha256sum target/release/gimlet | awk '{print $1}' > /tmp/here.txt

      - name: Build in another directory
        run: |
          mkdir -p /tmp/elsewhere
          git archive HEAD | tar -x -C /tmp/elsewhere
          cp Cargo.lock /tmp/elsewhere/
          cd /tmp/elsewhere
          RUSTFLAGS="--remap-path-prefix=/tmp/elsewhere=." \
            cargo build --release --locked -p gimlet-eye-cli
          sha256sum target/release/gimlet | awk '{print $1}' > /tmp/there.txt

      - name: Compare
        run: |
          here=$(cat /tmp/here.txt)
          there=$(cat /tmp/there.txt)
          echo "here:  $here"
          echo "there: $there"
          if [ "$here" != "$there" ]; then
            echo "::error::the same source produced two different binaries"
            echo "Something non-reproducible got in: an absolute path, a build"
            echo "timestamp, or an unlocked dependency."
            exit 1
          fi
          echo "$here" > /tmp/reproducible.sha256
          echo "reproducible: $here" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reproducible
          path: /tmp/reproducible.sha256

  publish:
    name: publish
    needs: [cli, desktop, reproducible]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Artifacts keep the directory structure of their `path:` glob, so the
      # installers arrive as appimage/, deb/, dmg/, nsis/. Flatten them: a
      # release listing is flat, and checksums are meaningless across folders.
      - name: Collect the files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -l release
          test -n "$(ls -A release)" || { echo "no artifacts to publish" >&2; exit 1; }
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # `minisign -S` verifies what it just wrote, which needs the public half.
      # The publish job does not check the repository out, and the key may postdate
      # the tag, so it is fetched from the tag when it is there and from the
      # default branch otherwise.
      - name: Fetch the release public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in "$RELEASE_TAG" "${{ github.event.repository.default_branch }}"; do
            if gh api "repos/${{ github.repository }}/contents/release-key.pub?ref=$ref" \
                --jq .content 2>/dev/null | base64 -d > release-key.pub; then
              if [ -s release-key.pub ]; then break; fi
            fi
          done
          test -s release-key.pub || {
            echo "::error::no release-key.pub in $RELEASE_TAG or the default branch"
            exit 1
          }
          head -1 release-key.pub

      # The checksums are what a user actually trusts, so they are what gets
      # signed. The key is long-lived and offline; only the secret half reaches
      # the runner, and only for this step.
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.unsigned || 'false' }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$ALLOW_UNSIGNED" != "true" ]; then
              cat >&2 <<'EOF'
          ::error::MINISIGN_SECRET_KEY is not set, so the release cannot be signed.

          Either add the release key as a repository secret (see "Release signing"
          in SECURITY.md), or re-run this workflow manually with `unsigned: true`
          when the key is genuinely unavailable. An unsigned release is a
          deliberate act, not a default.
          EOF
              exit 1
            fi
            echo "::warning::publishing an unsigned release at the operator's request"
            exit 0
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          chmod 600 "$RUNNER_TEMP/release.key"
          minisign -S -p release-key.pub -s "$RUNNER_TEMP/release.key" \
            -m release/SHA256SUMS -x release/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/release.key"
          minisign -V -p release-key.pub -m release/SHA256SUMS -x release/SHA256SUMS.minisig
          echo "signed SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      # `gh` uploads the files and leaves the release notes alone; the release
      # itself is written when the tag is cut.
      - name: Attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job does not check out the repository; tell `gh` which one.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "Gimlet Eye ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
