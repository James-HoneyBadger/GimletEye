name: release

# A tag produces the artifacts: CLI archives for five targets and desktop
# installers for Linux, macOS, and Windows, plus checksums, all attached to one
# release. Nothing is published unless every build succeeds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `inputs.tag` on a manual run, the pushed tag otherwise.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  cli:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: tar.gz
            linker: aarch64-linux-gnu-gcc
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            arch: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            arch: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p mellivora-cli --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="mellivora-${RELEASE_TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mellivora" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "mellivora-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mellivora.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macos-aarch64
            os: macos-14
            bundles: dmg
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install the JavaScript dependencies
        run: |
          npm ci --prefix packages/ui
          npm ci --prefix apps/desktop
          npm run build --prefix packages/ui

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # No tagName: build only. The publish job attaches everything.
          args: --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: publish
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -l
          sha256sum * > SHA256SUMS

      # `gh` uploads the files and leaves the release notes alone; the release
      # itself is written when the tag is cut.
      - name: Attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$(ls -A artifacts)" || { echo "no artifacts to upload" >&2; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "Mellivora ToolKit ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
