name: release

# A tag produces the artifacts: CLI archives for five targets and desktop
# installers for Linux, macOS, and Windows, plus checksums, all attached to one
# release. Nothing is published unless every build succeeds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string
      unsigned:
        description: Publish without a signature (only when the key is unavailable)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  # `inputs.tag` on a manual run, the pushed tag otherwise.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  cli:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # Everything a release contains is JavaScript now: one build, no per-target
      # artifact, and the same tree on every platform.
      - name: Build the CLI
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="gimlet-${RELEASE_TAG#v}-${{ matrix.target }}"
          mkdir -p "dist/$name/node_modules/@gimlet-eye" "dist/$name/node_modules/@noble"
          cp -r packages "dist/$name/packages"
          rm -rf "dist/$name/packages"/*/node_modules "dist/$name/packages"/*/*.tsbuildinfo
          # The workspace links are how `@gimlet-eye/core` resolves from the CLI
          # once the tree is unpacked somewhere else; the installers create the
          # same thing in scripts/stage-package.sh.
          ln -sfn ../../packages/core "dist/$name/node_modules/@gimlet-eye/core"
          ln -sfn ../../packages/engine "dist/$name/node_modules/@gimlet-eye/engine"
          cp -r node_modules/smol-toml "dist/$name/node_modules/smol-toml"
          cp -r node_modules/@noble/hashes "dist/$name/node_modules/@noble/hashes"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "gimlet-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item -Recurse packages "dist/$name/packages"
          Get-ChildItem "dist/$name/packages" -Directory | ForEach-Object {
            Remove-Item -Recurse -Force "$($_.FullName)/node_modules" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path "dist/$name/node_modules/@gimlet-eye" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/$name/node_modules/@noble" | Out-Null
          # A copy, not a junction: an NTFS junction stores an absolute target, so
          # one created here would point back at the build agent after unzip.
          "core", "engine" | ForEach-Object {
            Copy-Item -Recurse "dist/$name/packages/$_" "dist/$name/node_modules/@gimlet-eye/$_"
          }
          # `*.tsbuildinfo` holds absolute paths from the build agent, which is the
          # one thing the unix tarball strips and this step used to keep.
          Get-ChildItem "dist/$name/packages" -Recurse -Filter *.tsbuildinfo -File |
            Remove-Item -Force
          Copy-Item -Recurse node_modules/smol-toml "dist/$name/node_modules/smol-toml"
          Copy-Item -Recurse node_modules/@noble/hashes "dist/$name/node_modules/@noble/hashes"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The installer icon is the app's own Chromium drawing the UI tokens, so it is
  # rendered once here and handed to each desktop job: only the Linux runner has
  # an xvfb display to render it on.
  icon:
    name: icon (rendered from the UI tokens)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Render the icon
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run icon -w @gimlet-eye/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-icon
          path: apps/desktop/build/icon.png
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: icon
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macos-aarch64
            os: macos-14
            bundles: dmg
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # electron-builder picks up `build/icon.png` from the project directory.
      - name: Take the rendered icon
        uses: actions/download-artifact@v4
        with:
          name: desktop-icon
          path: apps/desktop/build

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # The bundle is one workspace: the desktop frontend imports packages/core,
      # so a partial install would build against a stale copy.
      - name: Install the JavaScript dependencies
        run: npm ci

      - name: Build the installers
        run: npm run package -w @gimlet-eye/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error

  # A release is only trustworthy if someone else can rebuild it. This builds the
  # same tag twice, from two different directories, and refuses to publish when
  # the bytes differ - which is what a leaked absolute path or a changed
  # dependency resolution looks like.
  reproducible:
    name: reproducible (rebuild and compare)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # What ships is JavaScript, so that is what is compared: every built file,
      # by content, in a stable order. An absolute path in a source map or an
      # unlocked dependency shows up as a difference.
      - name: Build here
        run: |
          npm ci
          npm run build
          find packages/*/dist apps/desktop/dist -type f -print0 |
            sort -z | xargs -0 sha256sum > /tmp/here.txt
          sha256sum /tmp/here.txt | awk '{print $1}' > /tmp/here.digest

      - name: Build in another directory
        run: |
          mkdir -p /tmp/elsewhere
          git archive HEAD | tar -x -C /tmp/elsewhere
          cd /tmp/elsewhere
          npm ci
          npm run build
          find packages/*/dist apps/desktop/dist -type f -print0 |
            sort -z | xargs -0 sha256sum > /tmp/there.txt
          sha256sum /tmp/there.txt | awk '{print $1}' > /tmp/there.digest

      - name: Compare
        run: |
          here=$(cat /tmp/here.digest)
          there=$(cat /tmp/there.digest)
          echo "here:  $here"
          echo "there: $there"
          if [ "$here" != "$there" ]; then
            echo "::error::the same source produced two different builds"
            echo "Something non-reproducible got in: an absolute path, a build"
            echo "timestamp, or an unlocked dependency."
            exit 1
          fi
          echo "$here" > /tmp/reproducible.sha256
          echo "reproducible: $here" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reproducible
          path: /tmp/reproducible.sha256

  publish:
    name: publish
    needs: [cli, desktop, reproducible]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Artifacts keep the directory structure of their `path:` glob, so the
      # installers arrive as appimage/, deb/, dmg/, nsis/. Flatten them: a
      # release listing is flat, and checksums are meaningless across folders.
      # The rendered icon travels through the same download but is an input to
      # the desktop builds, not something to publish.
      - name: Collect the files
        run: |
          mkdir -p release
          find artifacts -type f ! -name icon.png -exec cp {} release/ \;
          ls -l release
          test -n "$(ls -A release)" || { echo "no artifacts to publish" >&2; exit 1; }
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # `minisign -S` verifies what it just wrote, which needs the public half.
      # The publish job does not check the repository out, and the key may postdate
      # the tag, so it is fetched from the tag when it is there and from the
      # default branch otherwise.
      - name: Fetch the release public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in "$RELEASE_TAG" "${{ github.event.repository.default_branch }}"; do
            if gh api "repos/${{ github.repository }}/contents/release-key.pub?ref=$ref" \
                --jq .content 2>/dev/null | base64 -d > release-key.pub; then
              if [ -s release-key.pub ]; then break; fi
            fi
          done
          test -s release-key.pub || {
            echo "::error::no release-key.pub in $RELEASE_TAG or the default branch"
            exit 1
          }
          head -1 release-key.pub

      # The checksums are what a user actually trusts, so they are what gets
      # signed. The key is long-lived and offline; only the secret half reaches
      # the runner, and only for this step.
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.unsigned || 'false' }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            if [ "$ALLOW_UNSIGNED" != "true" ]; then
              cat >&2 <<'EOF'
          ::error::MINISIGN_SECRET_KEY is not set, so the release cannot be signed.

          Either add the release key as a repository secret (see "Release signing"
          in SECURITY.md), or re-run this workflow manually with `unsigned: true`
          when the key is genuinely unavailable. An unsigned release is a
          deliberate act, not a default.
          EOF
              exit 1
            fi
            echo "::warning::publishing an unsigned release at the operator's request"
            exit 0
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          chmod 600 "$RUNNER_TEMP/release.key"
          minisign -S -p release-key.pub -s "$RUNNER_TEMP/release.key" \
            -m release/SHA256SUMS -x release/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/release.key"
          minisign -V -p release-key.pub -m release/SHA256SUMS -x release/SHA256SUMS.minisig
          echo "signed SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      # `gh` uploads the files and leaves the release notes alone; the release
      # itself is written when the tag is cut.
      - name: Attach the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job does not check out the repository; tell `gh` which one.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "Gimlet Eye ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
