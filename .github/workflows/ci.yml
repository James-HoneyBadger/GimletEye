name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quiet-period:
    name: quiet period (frozen surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Versioned surfaces have not moved
        # No waiver here on purpose. The script knows the countdown restarted at
        # v0.8.0 (ADR 0008) and enforces from that tag on, so this reads as
        # "not enforcing yet" until 0.8.0 ships and then starts failing on any
        # change to a frozen surface. A permanent ALLOW_SURFACE_CHANGE would be
        # a required check that cannot fail.
        run: ./scripts/check-quiet-period.sh

  typescript:
    name: typescript (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type-check every package
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: integration (CLI, no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the CLI
        run: npm run build
      - name: Smoke test
        run: ./scripts/smoke.sh

  docs:
    name: docs (claims, surface, reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the CLI
        run: npm run build
      - name: Run the front-page examples
        run: ./scripts/check-readme-claims.sh
      - name: The public surface is documented
        run: ./scripts/check-public-surface.sh
      - name: Every tool is in the reference
        run: ./scripts/check-tool-reference.sh
      # Gate 3: the schema in each manifest is compared with what the tool
      # actually returned, so a report cannot drift from its contract.
      - name: Reports match their declared data schema
        run: ./scripts/check-data-schema.sh

  # The Rust targets saved their inputs; this replays them. A separate job
  # because `scripts/check-release-gates.sh` names it as Gate 2 evidence, and a
  # gate that points at "somewhere in npm test" is not evidence.
  corpus:
    name: corpus replay (parsers never panic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w @gimlet-eye/engine
      - run: npx vitest run packages/engine/test/corpus.test.ts

  # Gate 2 asks for evidence that the pieces agree, and the vitest suite mocks
  # the bridge — which is how "engine vnone" reached the window with every test
  # passing. This launches the real app and reads the files it wrote.
  e2e:
    name: e2e (Electron, real app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the app and the packages it imports
        run: |
          npm run build
          npm run build:ui -w @gimlet-eye/desktop
          npm run electron:build -w @gimlet-eye/desktop
      - name: Drive the real window
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" npm run e2e -w @gimlet-eye/desktop

  # Gate 4: install, upgrade, and roll back with real state, in a container.
  rehearsal:
    name: rehearsal (install, upgrade, roll back)
    runs-on: ubuntu-latest
    # A full package build per version; the default 6h is far more than it needs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build what the packages contain
        run: npm run build
      - name: Install, upgrade, roll back
        env:
          REQUIRE_REHEARSAL: '1'
        run: ./scripts/rehearse-upgrade.sh

  desktop:
    name: desktop (typecheck, UI bundle, shell check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `build:ui` builds @gimlet-eye/core first, which the type-check needs.
      - name: UI bundle
        run: npm run build:ui -w @gimlet-eye/desktop
      - name: Type-check the frontend
        run: npm run typecheck -w @gimlet-eye/desktop
      # The shell is TypeScript now. This compiles it against the same core the
      # CLI uses, and needs no system webview — which is also why the apt step
      # that used to stall this job is gone.
      - name: Shell builds
        run: npm run electron:build -w @gimlet-eye/desktop
      # The installer icon is rendered rather than checked in, so this proves the
      # script that renders it still runs. xvfb stands in for the display.
      - name: The installer icon renders
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run icon -w @gimlet-eye/desktop

  packaging:
    name: packaging (version agreement, staged layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build what the package contains
        run: npm run build
      - name: Packaging files agree on the version
        run: ./scripts/check-packaging.sh
      # Staging catches what a version check cannot: a symlink at the wrong
      # depth, a module that only resolves in the checkout, an engine the CLI
      # cannot find once node is the process name.
      - name: The staged package runs
        run: ./scripts/check-package-layout.sh

  # `scripts/check-release-gates.sh` reports "dependency policy" as a Gate 2 row
  # by looking for a job of this exact name, and SECURITY.md points here. It is
  # one graph now — there is no second lockfile for a shell or an engine — and it
  # is audited by npm rather than by cargo.
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Runtime dependencies only: a dev-dependency advisory cannot reach a user's
      # machine, and blocking on one would train people to ignore this gate.
      - name: Audit the shipped dependency set
        run: npm audit --omit=dev --audit-level=moderate
