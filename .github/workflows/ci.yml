name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MSRV: '1.85'

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The container's second implementation (`crates/crypto/tests/
      # second_implementation.rs`) is Python written from docs/CONTAINER.md.
      # `cryptography` supplies AEAD and X25519; `argon2-cffi` covers the
      # Argon2id path on distributions whose `cryptography` predates 44.
      - name: Install the second implementation's dependencies
        run: python3 -m pip install --break-system-packages cryptography argon2-cffi

      # ADR 0006 Gate 1 accepts OpenPGP interop as "an OpenPGP-signed file
      # verifies" and a `.gimlet` as "readable by a documented second
      # implementation". Both are only evidence if the tools actually ran, so the
      # tests are told to fail rather than skip when they are missing.
      - name: Test
        env:
          GIMLET_REQUIRE_GPG: '1'
          GIMLET_REQUIRE_SECOND_IMPL: '1'
        run: cargo test --workspace

  msrv:
    name: msrv (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Declared rust-version matches the tested one
        run: ./scripts/check-msrv.sh "$MSRV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - name: Check every crate on the declared MSRV
        run: cargo check --workspace --all-targets --locked

  quiet-period:
    name: quiet period (frozen surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Versioned surfaces have not moved
        # No waiver here on purpose. The script knows the countdown restarted at
        # v0.8.0 (ADR 0008) and enforces from that tag on, so this reads as
        # "not enforcing yet" until 0.8.0 ships and then starts failing on any
        # change to a frozen surface. A permanent ALLOW_SURFACE_CHANGE would be
        # a required check that cannot fail.
        run: ./scripts/check-quiet-period.sh

  typescript:
    name: typescript (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type-check every package
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: integration (CLI against the engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the engine and the CLI
        run: |
          cargo build --locked -p gimlet-eye-sidecar
          npm run build
      - name: Smoke test
        run: ./scripts/smoke.sh

  docs:
    name: docs (claims, surface, reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the engine and the CLI
        run: |
          cargo build --locked -p gimlet-eye-sidecar
          npm run build
      - name: Run the front-page examples
        run: ./scripts/check-readme-claims.sh
      - name: The public surface is documented
        run: ./scripts/check-public-surface.sh
      - name: Every tool is in the reference
        run: ./scripts/check-tool-reference.sh

  desktop:
    name: desktop (typecheck, UI bundle, shell check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      # Tauri's Linux shell links against webkit2gtk; without it the crate cannot
      # even be type-checked.
      - name: Install webkit2gtk and friends
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # `build:ui` builds @gimlet-eye/core first, which the type-check needs.
      - name: UI bundle
        run: npm run build:ui -w @gimlet-eye/desktop
      - name: Type-check the frontend
        run: npm run typecheck -w @gimlet-eye/desktop
      # Tauri validates `externalBin` while it builds, so the engine has to be
      # staged with the triple in its name before the shell is checked.
      - name: Stage the engine
        run: ./scripts/stage-tauri-engine.sh
      - name: Shell compiles
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  packaging:
    name: packaging (version agreement, staged layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build what the package contains
        run: |
          cargo build --release --locked -p gimlet-eye-sidecar
          npm run build
      - name: Packaging files agree on the version
        run: ./scripts/check-packaging.sh
      # Staging catches what a version check cannot: a symlink at the wrong
      # depth, a module that only resolves in the checkout, an engine the CLI
      # cannot find once node is the process name.
      - name: The staged package runs
        run: ./scripts/check-package-layout.sh

  # `deny.toml` at the root and `apps/desktop/src-tauri/deny.toml` both state
  # the policy is enforced, and `scripts/check-release-gates.sh` reports
  # "dependency policy" as a Gate 2 row by looking for a job of this exact
  # name. Nothing ran either graph until this job existed, which is how
  # alert #1 could sit on the default branch unnoticed.
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shell is a separate crate with its own lockfile, so the root graph
      # never sees the GTK stack that carries both accepted advisories.
      - name: Root graph (engine, CLI, sidecar)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./Cargo.toml

      # `check advisories` only: this policy file sets no license or ban rules,
      # and `cargo deny check` would apply the defaults and fail on licenses.
      # `--config` goes in `arguments` because cargo-deny rejects it after the
      # subcommand, and it must be explicit because the action runs from the
      # repository root, where the root policy would otherwise be discovered.
      - name: Desktop graph (the shell's own lockfile)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          manifest-path: ./apps/desktop/src-tauri/Cargo.toml
          arguments: --config apps/desktop/src-tauri/deny.toml
