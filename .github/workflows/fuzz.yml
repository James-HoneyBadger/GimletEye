name: fuzz

# The parsers delete bytes from irreplaceable files, and the container reader
# parses a format other implementations also write, so both are fuzzed rather
# than trusted. A nightly soak keeps `crates/scrub/fuzz` honest; the same entry
# points also run deterministically in `cargo test` via
# `crates/scrub/tests/parsers_never_panic.rs`, so a regression is caught on the
# commit that causes it and a deep one within a day.
#
# Release gate (ADR 0006): the last seven nightly runs must be green.

on:
  schedule:
    - cron: '17 3 * * *' # nightly, off the hour
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: '600'
        type: string

permissions:
  contents: read
  # A red night opens an issue: the soak is a release gate, and silence is how a
  # gate gets forgotten.
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      # `rust-toolchain.toml` pins stable for the workspace, and a toolchain
      # file outranks `rustup default`. Without this the sanitizer flags that
      # cargo-fuzz passes reach a stable rustc and the run dies with
      # "the option `Z` is only accepted on the nightly compiler".
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      # Two crates, one matrix: the scrub parsers and, since the container is a
      # parser too, the `.gimlet` reader. `extra` feeds a target the committed
      # fixtures it does not own.
      matrix:
        include:
          - { target: jpeg, crate: crates/scrub/fuzz, extra: "../tests/golden/fixtures ../tests/fixtures/gps" }
          - { target: png, crate: crates/scrub/fuzz, extra: "../tests/golden/fixtures ../tests/fixtures/gps" }
          - { target: webp, crate: crates/scrub/fuzz, extra: "../tests/golden/fixtures ../tests/fixtures/gps" }
          - { target: exif, crate: crates/scrub/fuzz, extra: "../tests/golden/fixtures ../tests/fixtures/gps" }
          - { target: container, crate: crates/crypto/fuzz, extra: "" }
    steps:
      - uses: actions/checkout@v4

      # libFuzzer needs nightly; the fuzz crate is detached from the workspace,
      # which stays on stable.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ matrix.crate }} -> target'

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The corpus grows across nights: libFuzzer's best input becomes tomorrow's
      # starting point, so a week of soaks explores far more than seven isolated
      # ten-minute runs. The committed seeds are only the floor.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.crate }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.crate }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          # Two seed directories: the committed per-format seeds, and the golden
          # corpus (a fixture of another format is a legitimate input - detection
          # by magic bytes is part of what is under test).
          cargo fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" \
            ${{ matrix.extra }} \
            -- -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1

      - name: Report coverage
        if: always()
        working-directory: ${{ matrix.crate }}
        run: |
          inputs=$(find "corpus/${{ matrix.target }}" -type f | wc -l)
          bytes=$(du -sk "corpus/${{ matrix.target }}" | cut -f1)
          echo "- ${{ matrix.target }}: $inputs input(s), ${bytes} KiB of corpus" >> "$GITHUB_STEP_SUMMARY"

      # Keep what the run learned, so evidence outlives the cache window.
      - name: Keep the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: ${{ matrix.crate }}/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

      # A failed night is a failed release gate six days later, when the why has
      # been forgotten. Open an issue the night it happens.
      - name: Report a failed night
        if: failure()
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "fuzz soak failed: ${{ matrix.target }}" \
            --body "The scheduled soak for \`${{ matrix.target }}\` failed in ${{ github.run_id }}. A red night restarts Gate 2's seven-night count, so fix it before the next run. Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: ${{ matrix.crate }}/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
