[workspace]
members = [
    "crates/core",
    "crates/sysadmin",
    "crates/crypto",
    "crates/scrub",
    "crates/server",
    "crates/cli",
]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["James Temple <james@honey-badger.org>"]
repository = "https://github.com/James-HoneyBadger/Mellivora_ToolKit"
homepage = "https://github.com/James-HoneyBadger/Mellivora_ToolKit"

[workspace.dependencies]
mellivora-core = { path = "crates/core", version = "0.1.0" }
mellivora-sysadmin = { path = "crates/sysadmin", version = "0.1.0" }
mellivora-crypto = { path = "crates/crypto", version = "0.1.0" }
mellivora-scrub = { path = "crates/scrub", version = "0.1.0" }
mellivora-server = { path = "crates/server", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
